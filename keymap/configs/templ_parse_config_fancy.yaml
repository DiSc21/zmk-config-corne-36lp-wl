    '&td_mm_z': {t: Z_, s: ⌨️💃}

    '&add_spc COMMA': {t: ',_'}
    '&add_spsh DOT':  {t: '._'}


    # LED keys
    '&rgb_ug RGB_TOG':
      tap: 💡
    '&rgb_ug RGB_EFR':
      tap: 💡
      hold: ⏮
    '&rgb_ug RGB_EFF':
      tap: 💡
      hold: ⏭
    '&rgb_ug RGB_SPD':
      tap: 💡
      hold: 🐢
    '&rgb_ug RGB_SPI':
      tap: 💡
      hold: 🏎️
    '&rgb_ug RGB_HUI':
      tap: 🎨
      hold: ➕
    '&rgb_ug RGB_HUD':
      tap: 🎨
      hold: ➖
    '&rgb_ug RGB_SAI':
      tap: 🌈
      hold: ➕
    '&rgb_ug RGB_SAD':
      tap: 🌈
      hold: ➖
    '&rgb_ug RGB_BRI':
      tap: 🌗
      hold: ➕
    '&rgb_ug RGB_BRD':
      tap: 🌗
      hold: ➖


    # Bluetooth 𝟎𝟏𝟐𝟑𝟒𝟓𝟔𝟕𝟖𝟗
    "&bt BT_CLR":
      tap: 📡
      shifted: 🗑️
    "&bt BT_SEL 0":
      tap: 📡
      shifted: 𝟎
    "&bt BT_SEL 1":
      tap: 📡
      shifted: 𝟏
    "&bt BT_SEL 2":
      tap: 📡
      shifted: 𝟐
    "&bt BT_SEL 3":
      tap: 📡
      shifted: 𝟑
    "&bt BT_SEL 4":
      tap: 📡
      shifted: 𝟒
    "&bt BT_SEL 5":
      tap: 📡
      shifted: 𝟓

  zmk_combos:

    # Layer Combos
    ##############
    combo_sticky_bt_led: {'k': 📌🚥}
    combo_to_smart_num: {'k': 🚩🔢}
    combo_smart_num: {'k': 🚩🔢}
    combo_to_default: {'k': 🚩🏠︎}
    combo_to_numbers: {'k': 🔘🔢}
    combo_to_navigation: {'k': 🔘🧭}

    # CrossRow Combos
    #################

    # opening braces and overlapping signs
    combo_curly_brace_l: {'k': '↗{',   a: mid, o: 0.01}
    combo_sqr_brace_l:   {'k': '↗[`↘', a: mid, o: 0.01}
    combo_brace_l:       {'k': '↗(',   a: mid, o: 0.01}
    ## closing braces
    combo_curly_brace_r: {'k': '↘}',    a: mid, o: 0.01}
    combo_sqr_brace_r:   {'k': '↘[%↗', a: mid, o: 0.01}
    combo_brace_r:       {'k': '↘)^↗', a: mid, o: 0.01}
    ## signs
    combo_caret:         {'k': '↘)^↗', a: mid, o: 0.01}
    combo_grave:         {'k': '↗[`↘', a: mid, o: 0.01}
    combo_perc:          {'k': '↘[%↗', a: mid, o: 0.01}

    # TopRow Combos
    ###############

    combo_star:          {'k': '*', a: top,    o: 0.1}
    combo_hash:          {'k': '#', a: top,    o: -0.1}

    # MidRow Combos
    ###############

    combo_ampers:        {'k': '&', a: top,    o: 0.235, dendron: true }
    combo_tilde:         {'k': '~', a: top,    o: 0.09}
    combo_at2:           {'k': '@', a: bottom, o: -0.08, p: [19,20,21,22]}
    combo_caps_word:     {'k': 🚩⏏}

    # BotRow Combos
    ###############

    combo_dollar:        {'k': '$', a: bottom, o: -0.1}
    combo_at:            {'k': '@', a: bottom, o: -0.0}

