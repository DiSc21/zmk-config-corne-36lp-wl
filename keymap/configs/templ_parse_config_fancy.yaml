    '&td_mm_r': {t: R_, s: ⌨️💃}
    '&td_mm_s': {t: S_, s: ⌨️💃}
    '&td_mm_t': {t: T_, s: ⌨️💃}

    '&td_mm_u': {t: U_, s: ⌨️💃}
    '&td_mm_v': {t: V_, s: ⌨️💃}
    '&td_mm_w': {t: W_, s: ⌨️💃}
    '&td_mm_x': {t: X_, s: ⌨️💃}
