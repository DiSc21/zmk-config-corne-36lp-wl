    STAR: '*'
    TAB: 🔮
    TILDE: '~'
    TILDE2: '~'
    UNDER: _
    UNDERSCORE: _
    RCTRL: 🕹️
    RALT:  ☯︎
    RGUI: 🐧
    RSHFT: ⏏
    RSHIFT: ⏏
    RIGHT_CONTROL: 🕹️
    RIGHT_ALT: ☯︎
    RIGHT_GUI: 🐧
    RIGHT_SHFT: ⏏
    LEFT: 🡄
    RIGHT: 🡆
    UP: 🡅
    DOWN: 🡇
    C_REWIND: '⏮'
    C_FAST_FORWARD: '⏭'
    C_PAUSE: '⏯'
    C_MUTE: "VOL\nMUTE"
    C_VOLUME_DOWN: "VOL\nDOWN"
    C_VOLUME_UP: "VOL\nUP"
    C_BRIGHTNESS_DEC: '☀↓'
    C_BRIGHTNESS_INC: '☀↑'
    LA(LEFT): ↞
    LA(RIGHT): ↠
    LG(LEFT): ⇤
    LG(RIGHT): ⇥
    'LS(LC(LG(LALT)))': 'HYPER'
    'RS(RC(RG(RALT)))': 'HYPER'
    'LC(LG(LALT))': 'MEH'
    'RC(RG(RALT))': 'MEH'
    'LG(Q)': '⌘Q'
    'LG(W)': '⌘W'
    'LG(GRAVE)': '⌘`'
    'LG(Z)': '⌘Z'
    'LG(X)': '⌘X'
    'LG(C)': '⌘C'
    'LG(V)': '⌘V'
    'LC(TAB)': '⌃↹'
    'LS(LC(TAB))': '⌃⇧↹'
  raw_binding_map:
    '&none': ''
    '&trans': ''
    '&to L_DEF': ''

    # ctrl-tabdance
    '&tdc_dot':
      tap: "💃."
    '&tdc_com':
      tap: "💃,"
    '&tdc_excl':
      tap: "💃Q"
    '&tdc_ques':
      tap: "💃/"


    # Mouse emo
    '&msc SCRL_LEFT':
      tap: 🖱️🢀
    '&msc SCRL_RIGHT':
      tap: 🖱️🢂
    '&msc SCRL_DOWN':
      tap: 🖱️🢃
    '&msc SCRL_UP':
      tap: 🖱️🢁

    '&mkp LCLK':
      tap: 🖱️L
    '&mkp MCLK':
      tap: 🖱️M
    '&mkp RCLK':
      tap: 🖱️R

    '&mmv MOVE_LEFT':
      tap: 🖱️🡄
    '&mmv MOVE_RIGHT':
      tap: 🖱️🡆
    '&mmv MOVE_UP':
      tap: 🖱️🡅
    '&mmv MOVE_DOWN':
      tap: 🖱️🡇

    # LED macros
    '&led_red 3': 'NAV'
    '&led_blu 2': 'SIGNS'
    '&led_pur 1': 'NUM'
    '&htl_nav 5': 'NAV'
    '&htl_mg 2': '⌐╦╦═─💥'
    '&htl_sn 1': '🔢'

    # toggle default layer
    '&tok_def A': {s: 🏠︎, t: A}
    '&tok_def B': {s: 🏠︎, t: B}
    '&tok_def C': {s: 🏠︎, t: C}
    '&tok_def D': {s: 🏠︎, t: D}
    '&tok_def E': {s: 🏠︎, t: E}

    '&tok_def F': {s: 🏠︎, t: F}
    '&tok_def G': {s: 🏠︎, t: G}
    '&tok_def H': {s: 🏠︎, t: H}
    '&tok_def I': {s: 🏠︎, t: I}
    '&tok_def J': {s: 🏠︎, t: J}

    '&tok_def K': {s: 🏠︎, t: K}
    '&tok_def L': {s: 🏠︎, t: L}
    '&tok_def M': {s: 🏠︎, t: M}
    '&tok_def N': {s: 🏠︎, t: N}
    '&tok_def O': {s: 🏠︎, t: O}

    '&tok_def P': {s: 🏠︎, t: P}
    '&tok_def Q': {s: 🏠︎, t: Q}
    '&tok_def R': {s: 🏠︎, t: R}
    '&tok_def S': {s: 🏠︎, t: S}
    '&tok_def T': {s: 🏠︎, t: T}

    '&tok_def U': {s: 🏠︎, t: U}
    '&tok_def V': {s: 🏠︎, t: V}
    '&tok_def W': {s: 🏠︎, t: W}
    '&tok_def X': {s: 🏠︎, t: X}
    '&tok_def Y': {s: 🏠︎, t: Y}

    '&tok_def Z': {s: 🏠︎, t: Z}

    '&tok_def RET':   {s: 🏠︎, t: ╰┈➤}
    '&tok_def ESC':   {s: 🏠︎, t: ☢️}
    '&tok_def FSLH':  {s: 🏠︎, t: /}
    '&tok_def SEMI':  {s: 🏠︎, t: ;}
    '&tok_def SPACE': {s: 🏠︎, t: 🪐}

    # toggle default layer
    '&td_mm_a': {t: A_, s: ⌨️💃}
    '&td_mm_b': {t: B_, s: ⌨️💃}
    '&td_mm_c': {t: C_, s: ⌨️💃}
    '&td_mm_d': {t: D_, s: ⌨️💃}
    '&td_mm_e': {t: E_, s: ⌨️💃}

    '&td_mm_f': {t: F_, s: ⌨️💃}
    '&td_mm_g': {t: G_, s: ⌨️💃}
    '&td_mm_h': {t: H_, s: ⌨️💃}
    '&td_mm_i': {t: I_, s: ⌨️💃}
    '&td_mm_j': {t: J_, s: ⌨️💃}

    '&td_mm_k': {t: K_, s: ⌨️💃}
