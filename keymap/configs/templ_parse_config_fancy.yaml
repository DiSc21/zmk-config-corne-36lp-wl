    AMPS: '&'
    APOS: .
    APOSTROPHE: <
    ASTERISK: '*'
    ASTRK: '*'
    AT: '@'
    AT_SIGN: '@'
    BACKSLASH: '\'
    BSLH: \
    BSPC: ✂️
    CARET: ^
    COLON: ':'
    COMMA: ','
    DEL: 🗑️
    DLLR: $
    DOLLAR: $
    DOT: '.'
    DOUBLE_QUOTES: '"'
    DQT: '"'
    END: 🏁
    EQUAL: '='
    ESC: ☢️
    ESCAPE: ☢️
    EXCL: '!'
    EXCLAMATION: '!'
    FSLH: /
    GRAVE: '`'
    GREATER_THAN: '>'
    GT: '>'
    HASH: '#'
    HOME: 🏡
    INS: 📥
    INSERT: 📥
    LBKT: '['
    LBRC: '{'
    LEFT_BRACE: '{'
    LEFT_BRACKET: '['
    LEFT_PARENTHESIS: (
    LESS_THAN: <
    LCTRL: 🕹️
    LALT: ☯︎
    LGUI: 🐧
    LSHFT: ⏏
    LSHIFT: ⏏
    LEFT_CONTROL: 🕹️
    LEFT_ALT: ☯︎
    LEFT_GUI: 🐧
    LEFT_SHFT: ⏏
    LPAR: (
    LT: <
    MINUS: '-'
    NON_US_BACKSLASH: \
    NON_US_BSLH: '|'
    NON_US_HASH: '#'
    NUHS: '#'
    PERCENT: '%'
    PERIOD: .
    PG_DN: 📜🢃
    PG_UP: 📜🢁
    PIPE: '|'
    PIPE2: '|'
    PLUS: +
    POUND: '#'
    PRCNT: '%'
    PSCRN: 📸
    QMARK: '?'
    QUESTION: '?'
    RBKT: ']'
    RBRC: '}'
    RET: ╰┈➤
    RETURN: ╰┈➤
    RIGHT_BRACE: '}'
    RIGHT_BRACKET: ']'
    RIGHT_PARENTHESIS: )
    RPAR: )
    SEMI: ';'
    SEMICOLON:  ';'
    SINGLE_QUOTE: ''''
